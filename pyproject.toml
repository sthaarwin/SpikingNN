[project]
name = "snn"
version = "0.1.0"
description = "This is about implementation of Spiking Neural Network"
readme = "README.md"
authors = [
    { name = "sthaarwin", email = "sthaarwin123@gmail.com" }
]
requires-python = ">=3.11.8"
dependencies = [
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[project.scripts]
snn = "snn:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
